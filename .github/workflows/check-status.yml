name: Verificar servicios

on:
  schedule:
    # Evita los minutos de mayor congestión de GitHub Actions.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: service-status-check
  cancel-in-progress: false

jobs:
  check:
    outputs:
      persist: ${{ steps.monitor.outputs.persist }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Permite validar una corrección manual desde su rama antes de
          # fusionarla. Las ejecuciones programadas continúan usando main.
          ref: ${{ github.ref_name }}

      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Recuperar el último estado persistido
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin \
            refs/heads/status-data:refs/remotes/origin/status-data
          git show refs/remotes/origin/status-data:data/status.json > data/status.json
          git show refs/remotes/origin/status-data:data/incidents.json > data/incidents.json
          node -e "JSON.parse(require('fs').readFileSync('data/status.json', 'utf8')); JSON.parse(require('fs').readFileSync('data/incidents.json', 'utf8'))"

      - name: Ejecutar pruebas
        run: npm run check

      - name: Verificar servicios
        id: monitor
        shell: bash
        env:
          MEETING_HEALTH_TOKEN: ${{ secrets.MEETING_HEALTH_TOKEN }}
        run: |
          result="$(node scripts/check-status.mjs)"
          echo "${result}"
          echo "persist=$(jq -r '.persistRequired // false' <<<"${result}")" >> "${GITHUB_OUTPUT}"

      - name: Preparar estado persistible
        shell: bash
        run: |
          mkdir -p _state/data
          cp data/status.json data/incidents.json _state/data/

      - name: Subir estado persistible
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monitor-state
          path: _state
          if-no-files-found: error
          retention-days: 2

  persist:
    if: needs.check.outputs.persist == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: check
    steps:
      - name: Descargar rama de estado
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: status-data
          fetch-depth: 1

      - name: Descargar estado medido
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: monitor-state
          path: ${{ runner.temp }}/monitor-state

      - name: Persistir exclusivamente los JSON públicos
        shell: bash
        run: |
          test -f "${RUNNER_TEMP}/monitor-state/data/status.json"
          test -f "${RUNNER_TEMP}/monitor-state/data/incidents.json"
          test "$(find "${RUNNER_TEMP}/monitor-state" -type f | wc -l)" -eq 2
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); JSON.parse(require('fs').readFileSync(process.argv[2], 'utf8'))" \
            "${RUNNER_TEMP}/monitor-state/data/status.json" \
            "${RUNNER_TEMP}/monitor-state/data/incidents.json"

          cp "${RUNNER_TEMP}/monitor-state/data/status.json" data/status.json
          cp "${RUNNER_TEMP}/monitor-state/data/incidents.json" data/incidents.json

          unexpected="$(git status --porcelain --untracked-files=all | awk '$2 != "data/incidents.json" && $2 != "data/status.json" { print $2 }')"
          test -z "${unexpected}"
          if git diff --quiet -- data/status.json data/incidents.json; then
            echo 'La medición debía persistirse, pero los JSON no cambiaron.' >&2
            exit 1
          fi

          git config user.name "status-monitor[bot]"
          git config user.email "status-monitor[bot]@users.noreply.github.com"
          git add -- data/status.json data/incidents.json
          git commit -m "Actualizar estado del servicio"
          git push origin HEAD:status-data
